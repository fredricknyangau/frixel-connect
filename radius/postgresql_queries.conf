# Frixel Connect tenant-scoped FreeRADIUS SQL queries (T4).
#
# NAS-Identifier is set during MikroTik provisioning as:
#   Frixel Connect-{first 8 chars of tenant UUID without dashes}
# e.g. tenant aaaaaaaa-0000-... → NAS-Identifier "Frixel Connect-aaaaaaaa"
#
# PRODUCTION NOTE: prefer a dedicated nas_identifier column on routers and
# resolve tenant_id from that table instead of string matching on tenants.id.

safe_characters = "@abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_: /"

authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authcheck_table} \
	WHERE username = '%{SQL-User-Name}' \
	  AND tenant_id = ( \
	    SELECT id FROM tenants \
	    WHERE left(replace(id::text, '-', ''), 8) = substring('%{NAS-Identifier}' from 10 for 8) \
	      AND status = 'active' \
	    LIMIT 1 \
	  ) \
	ORDER BY id"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM ${authreply_table} \
	WHERE username = '%{SQL-User-Name}' \
	  AND tenant_id = ( \
	    SELECT id FROM tenants \
	    WHERE left(replace(id::text, '-', ''), 8) = substring('%{NAS-Identifier}' from 10 for 8) \
	      AND status = 'active' \
	    LIMIT 1 \
	  ) \
	ORDER BY id"
