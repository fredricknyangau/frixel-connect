services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime          # only build up to the runtime stage
    image: wifi_billing_app:latest   # tag the image so the worker can reuse it
    container_name: wifi_billing_api
    command: ["bash", "scripts/start.sh", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "${PORT:-8000}", "--workers", "${WEB_CONCURRENCY:-1}"]
    environment:
      - USE_DOCKER=true
      - PORT=${PORT:-8000}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FERNET_SECRET_KEY=${FERNET_SECRET_KEY}
      - DARAJA_CONSUMER_KEY=${DARAJA_CONSUMER_KEY}
      - DARAJA_CONSUMER_SECRET=${DARAJA_CONSUMER_SECRET}
      - DARAJA_SHORTCODE=${DARAJA_SHORTCODE}
      - DARAJA_PASSKEY=${DARAJA_PASSKEY}
      - DARAJA_CALLBACK_URL=${DARAJA_CALLBACK_URL}
      - DARAJA_ENVIRONMENT=${DARAJA_ENVIRONMENT:-sandbox}
      - KRA_ETIMS_MOCK=${KRA_ETIMS_MOCK:-True}
      - MIKROTIK_HOST=${MIKROTIK_HOST}
      - MIKROTIK_PORT=${MIKROTIK_PORT:-80}
      - MIKROTIK_USERNAME=${MIKROTIK_USERNAME}
      - MIKROTIK_PASSWORD=${MIKROTIK_PASSWORD}
      - CHR_HOST_IP=${CHR_HOST_IP}
      - CHR_BACKEND_PORT=${CHR_BACKEND_PORT}
      - CHR_FRONTEND_URL=${CHR_FRONTEND_URL}
      - CHR_HOST_ONLY_NETWORK=${CHR_HOST_ONLY_NETWORK}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - wifi_billing_net

  api-worker:
    image: wifi_billing_app:latest   # reuses the image built by the api service
    container_name: wifi_billing_worker
    command: arq app.worker.WorkerSettings
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FERNET_SECRET_KEY=${FERNET_SECRET_KEY}
      - DARAJA_CONSUMER_KEY=${DARAJA_CONSUMER_KEY}
      - DARAJA_CONSUMER_SECRET=${DARAJA_CONSUMER_SECRET}
      - DARAJA_SHORTCODE=${DARAJA_SHORTCODE}
      - DARAJA_PASSKEY=${DARAJA_PASSKEY}
      - DARAJA_CALLBACK_URL=${DARAJA_CALLBACK_URL}
      - DARAJA_ENVIRONMENT=${DARAJA_ENVIRONMENT:-sandbox}
      - KRA_ETIMS_MOCK=${KRA_ETIMS_MOCK:-True}
      - MIKROTIK_HOST=${MIKROTIK_HOST}
      - MIKROTIK_PORT=${MIKROTIK_PORT:-80}
      - MIKROTIK_USERNAME=${MIKROTIK_USERNAME}
      - MIKROTIK_PASSWORD=${MIKROTIK_PASSWORD}
      - CHR_HOST_IP=${CHR_HOST_IP}
      - CHR_BACKEND_PORT=${CHR_BACKEND_PORT}
      - CHR_FRONTEND_URL=${CHR_FRONTEND_URL}
      - CHR_HOST_ONLY_NETWORK=${CHR_HOST_ONLY_NETWORK}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started  # ensures the image is built before worker starts
    restart: unless-stopped
    networks:
      - wifi_billing_net

  db:
    image: postgres:16-alpine
    container_name: wifi_billing_db
    environment:
      POSTGRES_DB: wifi_billing
      POSTGRES_USER: frixel
      POSTGRES_PASSWORD: frixel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frixel -d wifi_billing"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wifi_billing_net

  redis:
    image: redis:7-alpine
    container_name: wifi_billing_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - wifi_billing_net

  nginx:
    image: nginx:alpine
    container_name: wifi_billing_nginx
    ports:
      - "80:80"
    environment:
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - NGINX_ENVSUBST_FILTER=TRUSTED_PROXIES
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - wifi_billing_net

  radius:
    build: ./radius
    container_name: wifi_billing_radius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RADIUS_SECRET=${RADIUS_SECRET:-testing123}
    volumes:
      - ./radius/clients.conf:/etc/raddb/clients.conf
      - ./radius/sql_module_config:/etc/raddb/mods-enabled/sql
      - ./radius/site_default_config:/etc/raddb/sites-enabled/default
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wifi_billing_net

volumes:
  postgres_data:
  redis_data:

networks:
  wifi_billing_net:
    driver: bridge