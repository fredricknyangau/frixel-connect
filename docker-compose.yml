services:
  api:
    build: .
    container_name: wifi_billing_api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wifi_billing_net

  db:
    image: postgres:16-alpine
    container_name: wifi_billing_db
    environment:
      POSTGRES_DB: wifi_billing
      POSTGRES_USER: zealnet
      POSTGRES_PASSWORD: zealnet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port 5432 is NOT exposed to the host to avoid conflicts with other
    # PostgreSQL containers. Use: docker compose exec db psql -U zealnet wifi_billing
    # to connect from outside. The api container connects via the internal
    # Docker network using the service name 'db' as the hostname.
    healthcheck:
      # IMPORTANT: use the actual DB user (zealnet), not a placeholder.
      # pg_isready checks if PostgreSQL is accepting connections.
      test: ["CMD-SHELL", "pg_isready -U zealnet -d wifi_billing"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wifi_billing_net

  nginx:
    image: nginx:alpine
    container_name: wifi_billing_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - wifi_billing_net

volumes:
  postgres_data:

networks:
  wifi_billing_net:
    driver: bridge
